<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gamepad Tester | GSMPoint Tools</title>

<meta name="description"
content="Probá botones, sticks, gatillos y vibración de tu joystick desde el navegador.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<a href="../">
← Volver a GSMPoint Tools
</a>

<h1>🎮 Gamepad Tester</h1>

<p>
Probá tu joystick directamente desde el navegador.
</p>

</header>



<main>


<div id="connection-status" class="status-disconnected">

Ningún joystick conectado

</div>




<div id="empty-state">

<div class="icon">
🎮
</div>

<p>
Conectá un joystick y presioná cualquier botón para comenzar.
</p>

</div>





<div id="tester-ui" class="hidden">



<h2 id="controller-name"></h2>



<div class="controller">



<div class="shoulder left">
L1
</div>


<div class="shoulder right">
R1
</div>




<div class="face-buttons">


<button id="btn-3">
△
</button>


<button id="btn-2">
□
</button>


<button id="btn-1">
○
</button>


<button id="btn-0">
✕
</button>


</div>





<div class="sticks">


<div class="stick">

<div id="stick-left">
🕹️
</div>

<span>
L
</span>

</div>



<div class="stick">

<div id="stick-right">
🕹️
</div>

<span>
R
</span>

</div>



</div>



</div>





<div class="info-box">

<h3>🎮 Botones detectados</h3>

<p id="buttons">
Ninguno
</p>

</div>





<div class="info-box">

<h3>🕹️ Ejes analógicos</h3>

<p id="axes">
-
</p>

</div>



</div>



</main>



<script src="app.js"></script>


</body>
</html>
