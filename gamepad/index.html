<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Gamepad Tester | GSMPoint Tools
</title>


<meta name="description"
content="Tester de joystick online. Probá botones, sticks, gatillos y vibración desde el navegador.">


<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">


<link rel="stylesheet" href="style.css">


</head>


<body>



<header>


<a href="../">
← Volver a GSMPoint Tools
</a>


<h1>
🎮 Gamepad Tester
</h1>


<p>
Probá tu joystick USB o Bluetooth
</p>



</header>





<main>



<div id="connection-status"
class="status">


Buscando joystick...


</div>





<section id="tester"
class="hidden">





<div class="controller-info">


<h2 id="controller-name">

</h2>


<span id="connection-type">

</span>


</div>








<div class="gamepad-container">


<img 
src="assets/dualshock.svg"
class="gamepad-svg"
>




<!-- BOTONES ACCIÓN -->


<div class="button triangle"
id="triangle">

△

</div>



<div class="button circle"
id="circle">

○

</div>



<div class="button square"
id="square">

□

</div>



<div class="button cross"
id="cross">

✕


</div>







<!-- STICKS -->


<div class="stick left-stick">


<div class="stick-inner"
id="left-stick">

</div>


<span id="left-percent">
0%
</span>


</div>






<div class="stick right-stick">


<div class="stick-inner"
id="right-stick">

</div>


<span id="right-percent">
0%
</span>


</div>







<!-- GATILLOS -->


<div class="trigger l2">


<div class="trigger-fill"
id="l2">

</div>


<span>L2</span>


</div>




<div class="trigger r2">


<div class="trigger-fill"
id="r2">

</div>


<span>R2</span>


</div>






</div>








<div class="tests">


<h3>
Entradas detectadas
</h3>


<div id="button-list">

</div>


</div>








<div class="actions">


<button id="vibrate">

🔊 Probar vibración

</button>


</div>





</section>



</main>





<script src="app.js"></script>


</body>

</html>
