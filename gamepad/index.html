                            x1="0"
                            y1="0"
                            x2="0"
                            y2="1"
                        >

                            <stop
                                offset="0%"
                                stop-color="#ffffff"
                            />

                            <stop
                                offset="100%"
                                stop-color="#f1f3f6"
                            />

                        </linearGradient>


                        <!-- =================================================
                             TOUCHPAD
                        ================================================== -->

                        <linearGradient
                            id="touchGradient"
                            x1="0"
                            y1="0"
                            x2="0"
                            y2="1"

                            <stop
                                offset="0%"
                                stop-color="#fafafa"
                            />

                            <stop
                                offset="100%"
                                stop-color="#e8ebef"
                            />

                        </linearGradient>


                        <!-- =================================================
                             STICK
                        ================================================== -->

                        <radialGradient
                            id="stickGradient"
                        >

                            <stop
                                offset="0%"
                                stop-color="#454c56"
                            />

                            <stop
                                offset="70%"
                                stop-color="#252b33"
                            />

                            <stop
                                offset="100%"
                                stop-color="#10151b"
                            />

                        </radialGradient>


                        <!-- =================================================
                             SOMBRA CUERPO
                        ================================================== -->

                        <filter
                            id="gpShadow"
                            x="-20%"
                            y="-20%"
                            width="140%"
                            height="150%"
                        >

                            <feDropShadow
                                dx="0"
                                dy="5"
                                stdDeviation="6"
                                flood-color="#64748b"
                                flood-opacity=".16"
                            />

                        </filter>


                        <!-- =================================================
                             SOMBRA BOTONES
                        ================================================== -->

                        <filter
                            id="buttonShadow"
                            x="-30%"
                            y="-30%"
                            width="160%"
                            height="160%"
                        >

                            <feDropShadow
                                dx="0"
                                dy="2"
                                stdDeviation="2"
                                flood-color="#000000"
                                flood-opacity=".25"
                            />

                        </filter>
