<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Gamepad Tester | GSMPoint Tools
</title>


<meta name="description"
content="Probá tu joystick PS4, PS5, Xbox, Switch o genérico desde el navegador.">


<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">


<link rel="stylesheet" href="style.css">


</head>


<body>


<header>


<a href="../">
← Volver a GSMPoint Tools
</a>


<h1>
🎮 Gamepad Tester
</h1>


<p>
Probá tu joystick USB o Bluetooth directamente desde el navegador.
</p>


</header>




<main>



<div id="connection-status"
class="status">


Esperando joystick...


</div>





<section id="tester"
class="hidden">



<div class="controller-info">


<h2 id="controller-name">
</h2>


<p id="controller-type">
</p>


</div>





<div class="controller-view">


<div id="gamepad-container" class="gamepad-svg">

</div>





<div class="info-box">


<h3>
Información
</h3>


<p id="details">

Conectá un joystick para comenzar.

</p>


</div>




<button id="vibrate">

🔊 Probar vibración

</button>




</section>



</main>





<script src="app.js"></script>


</body>

</html>
