  <!-- D-PAD -->
  <g class="dpad">
    <path class="dpad-main"
      d="M143 76 H162 C165 76 167 78 167 81 V96 H182
         C185 96 187 98 187 101 V119 C187 122 185 124 182 124
         H167 V139 C167 142 165 144 162 144 H143
         C140 144 138 142 138 139 V124 H123
         C120 124 118 122 118 119 V101 C118 98 120 96 123 96
         H138 V81 C138 78 140 76 143 76 Z"/>
    <path class="dpad-arrow" d="M152 82 L146 90 H158 Z"/>
    <path class="dpad-arrow" d="M152 138 L146 130 H158 Z"/>
    <path class="dpad-arrow" d="M124 110 L132 104 V116 Z"/>
    <path class="dpad-arrow" d="M180 110 L172 104 V116 Z"/>
  </g>

  <!-- SHARE / OPTIONS -->
  <text class="label" x="186" y="55">SHARE</text>
  <rect class="small-button" x="182" y="61" width="18" height="27" rx="9"/>

  <text class="label" x="494" y="55">OPTIONS</text>
  <rect class="small-button" x="480" y="61" width="18" height="27" rx="9"/>

  <!-- FACE BUTTONS -->
  <g class="face-buttons">
    <circle class="face-button" data-button="3" cx="538" cy="75" r="18"/>
    <text class="symbol triangle" x="538" y="82">△</text>

    <circle class="face-button" data-button="2" cx="506" cy="107" r="18"/>
    <text class="symbol square" x="506" y="113">□</text>

    <circle class="face-button" data-button="1" cx="570" cy="107" r="18"/>
    <text class="symbol circle" x="570" y="113">○</text>

    <circle class="face-button" data-button="0" cx="538" cy="139" r="18"/>
    <text class="symbol cross" x="538" y="146">×</text>
  </g>

  <!-- STICK IZQUIERDO -->
  <g class="analog" data-stick="left">
    <circle class="analog-ring" cx="245" cy="218" r="37"/>
    <circle class="analog-progress active" cx="245" cy="218" r="33"/>
    <circle class="analog-knob" cx="245" cy="218" r="17"/>
    <circle class="analog-highlight" cx="240" cy="213" r="5"/>
    <text class="analog-percent" x="245" y="257">75%</text>
  </g>

  <!-- STICK DERECHO -->
  <g class="analog" data-stick="right">
    <circle class="analog-ring" cx="435" cy="218" r="37"/>
    <circle class="analog-progress active" cx="435" cy="218" r="33"/>
    <circle class="analog-knob" cx="435" cy="218" r="17"/>
    <circle class="analog-highlight" cx="430" cy="213" r="5"/>
    <text class="analog-percent" x="435" y="257">62%</text>
  </g>

  <!-- PLAYSTATION CENTRAL -->
  <text class="ps-logo" x="340" y="190">PS</text>

  <rect class="ps-light" x="326" y="201" width="28" height="6" rx="3"/>

  <g class="center-dots">
    <circle cx="323" cy="222" r="2.2"/>
    <circle cx="332" cy="218" r="2.2"/>
    <circle cx="340" cy="222" r="2.2"/>
    <circle cx="348" cy="218" r="2.2"/>
    <circle cx="357" cy="222" r="2.2"/>
  </g>

  <circle class="ps-button" cx="340" cy="245" r="11"/>
  <text class="ps-button-text" x="340" y="249">PS</text>

  <text class="touch-percent" x="340" y="162">100%</text>

  <!-- GATILLO L2 -->
  <g class="trigger-widget" data-trigger="l2">
    <rect class="trigger-title" x="8" y="0" width="42" height="28" rx="8"/>
    <text class="trigger-text" x="29" y="18">L2</text>
    <rect class="trigger-track" x="14" y="38" width="30" height="92" rx="4"/>
    <rect class="trigger-fill" x="14" y="97" width="30" height="33" rx="3"/>
    <text class="trigger-percent" x="29" y="146">35%</text>
  </g>

  <!-- GATILLO R2 -->
  <g class="trigger-widget" data-trigger="r2">
    <rect class="trigger-title" x="630" y="0" width="42" height="28" rx="8"/>
    <text class="trigger-text" x="651" y="18">R2</text>
    <rect class="trigger-track" x="636" y="38" width="30" height="92" rx="4"/>
    <rect class="trigger-fill" x="636" y="58" width="30" height="72" rx="3"/>
    <text class="trigger-percent" x="651" y="146">78%</text>
  </g>

</svg>
