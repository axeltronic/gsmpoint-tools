      <circle cx="298" cy="45" r="1.4"/><circle cx="310" cy="45" r="1.4"/>
      <circle cx="322" cy="45" r="1.4"/><circle cx="334" cy="45" r="1.4"/>
      <circle cx="346" cy="45" r="1.4"/><circle cx="358" cy="45" r="1.4"/>
      <circle cx="370" cy="45" r="1.4"/><circle cx="382" cy="45" r="1.4"/>
      <circle cx="394" cy="45" r="1.4"/><circle cx="406" cy="45" r="1.4"/>
